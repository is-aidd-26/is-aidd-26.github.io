---
layout: default
permalink: /lectures/
title: Лекции
---

<h1>Лекции</h1>

<ul class="content-list">
  {% for lecture in site.data.lectures %}
  <li>
    <span class="num">{% include ru_date.html date=lecture.date %}</span>
    <a href="{{ '/assets/lectures/' | append: lecture.file | relative_url }}">{{ lecture.title }}</a>
    <span class="badge">PDF</span>
  </li>
  {% endfor %}
</ul>
