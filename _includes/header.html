<header class="site-header">
  <div class="container header-inner">
    <a class="site-title" href="{{ '/' | relative_url }}">{{ site.title }}</a>
    <nav class="site-nav">
      {% for item in site.data.nav %}
        {% assign active = false %}
        {% if item.url == '/' and page.url == '/' %}
          {% assign active = true %}
        {% elsif item.url != '/' and page.url != '/' and page.url contains item.url %}
          {% assign active = true %}
        {% endif %}
        <a class="nav-link{% if active %} active{% endif %}" href="{{ item.url | relative_url }}">{{ item.title }}</a>
      {% endfor %}
    </nav>
  </div>
</header>
